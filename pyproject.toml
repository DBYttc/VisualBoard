[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "krybord"
version = "0.1.0"
description = "Gesture-based virtual keyboard using MediaPipe Hands"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8.0,<5",
    "mediapipe==0.10.14",
    "numpy>=1.24.0,<3",
    "pynput>=1.7.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[project.scripts]
krybord = "krybord.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
