camera:
  device_index: 1
  width: 1280
  height: 720
  mirror: true
  # auto = 先试 DSHOW（Windows 上打开内置摄像头比默认的 MSMF 快很多，
  #        实测 MSMF 8~24 秒、DSHOW 0.6 秒），打不开再退回系统默认
  # 也可以强制指定：dshow / msmf
  backend: auto
  # force  = 让摄像头按 width x height 输出（最清晰；但某些驱动切换分辨率要 2~3 秒）
  # native = 用摄像头默认分辨率采集，程序内部缩放到 width x height
  #          （启动快 ~2.5 秒；代价是真实采样精度取决于默认分辨率，通常是 640x480）
  capture: force

mediapipe:
  max_num_hands: 1
  min_detection_confidence: 0.75
  min_tracking_confidence: 0.75
  model_complexity: 1

interaction:
  pinch_threshold_px: 45
  cooldown_sec: 0.4
  hover_sec: 0.5
  trigger_mode: pinch  # pinch | hover | both
  pinch_fire_on: press_edge  # release | stable_frames | press_edge
  pinch_stable_frames: 3
  pinch_source: depth  # contact | depth | both（depth = 五指投影长度变化）

# 用"手指表观尺寸随距离的变化"判断是否按下。
# 物理：单目下 w_px ≈ f·W/Z，所以尺寸变大 = 离摄像头更近。
# source=finger_length 时走五指独立投影按压（俯视桌面打字）。
depth_press:
  enabled: true
  source: finger_length # mask | hand_scale | finger_length（五指 MCP->TIP 投影）
  direction: far        # far = 尺寸变小算按下（俯视：手指下压）；near = 变大算按下（前置：手指伸向镜头）
  baseline_mode: rolling  # rolling = 基线跟着手走；startup = 启动后标定一次并冻结
  warmup_sec: 5.0       # startup 模式的摆姿势时间（从检测到手开始计时）
  enter_ratio: 1.12     # 相对基线变化 12% 进入按压态（1.20 = 变化 20%）
  exit_ratio: 1.06      # 回到 6% 以内算松开（迟滞，防抖）
  stable_frames: 4      # 连续 N 帧确认才算按下
  baseline_samples: 45  # 基线 = 最近 N 帧中位数（约 1.5s@30fps）
  min_samples: 15       # 基线样本不足时不出信号
  latch_key: true       # 按下瞬间锁定键位，抵消下压时的视差漂移
  finger_landmarks: [6, 7]  # 量宽用的指段（默认食指中节）
  half_len_px: 18       # 从中心往两侧搜索的最大半宽
  samples: 5            # 沿指段的采样点数（取中位数）
  center_tol_px: 3
  min_segment_px: 8     # 指段投影短于此值视为不可靠
  morph_kernel: 5       # 掩膜形态学核（<3 表示不做）
  skin_y_min: 40        # 以下为 YCrCb 肤色阈值，光照不同可调
  skin_cr_min: 133
  skin_cr_max: 173
  skin_cb_min: 77
  skin_cb_max: 127

smoothing:
  ema_alpha: 0.3

ui:
  keyboard_origin: [20, 280]
  key_width: 52
  key_height: 52
  key_gap: 6
  row_gap: 8
  show_skeleton: true
  show_fps: true
  demo_mode: false

demo:
  window_name: "VisualBoard Virtual Keyboard"

mode:
  default: keyboard  # keyboard | mouse

mouse:
  move_enabled: true
